<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LayerOne.Uz — Филамент</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L1</div>
        <div><b>LayerOne.Uz</b><span>Филамент для 3D-печати</span></div>
      </div>
      <button class="icon-btn" id="cartTop">🛒<i id="cartBadge">0</i></button>
    </header>

    <main>
      <section id="home" class="screen active">
        <div class="hero">
          <div>
            <small>3D PRINTING MATERIALS</small>
            <h1>Филамент<br>для ваших идей</h1>
            <p>PLA, PETG, TPU и другие материалы для 3D-печати.</p>
            <button class="primary" onclick="showScreen('catalog')">Перейти в каталог →</button>
          </div>
          <div class="spools">◉</div>
        </div>
        <h2>Категории</h2>
        <div class="categories" id="categories"></div>
      </section>

      <section id="catalog" class="screen">
        <div class="section-head"><button class="back" onclick="showScreen('home')">‹</button><h1>Каталог</h1></div>
        <div class="search"><input id="search" placeholder="Поиск по товарам..."> 🔎</div>
        <div class="filters">
          <button data-filter="all" class="filter active">Все</button>
          <button data-filter="PLA" class="filter">PLA</button>
          <button data-filter="PETG" class="filter">PETG</button>
          <button data-filter="TPU" class="filter">TPU</button>
          <button data-filter="ABS" class="filter">ABS</button>
        </div>
        <div id="products" class="products"></div>
      </section>

      <section id="product" class="screen">
        <div class="section-head"><button class="back" onclick="showScreen('catalog')">‹</button><h1>Товар</h1></div>
        <div id="productDetail"></div>
      </section>

      <section id="cart" class="screen">
        <div class="section-head"><h1>Корзина</h1><button class="trash" onclick="clearCart()">🗑</button></div>
        <div id="cartItems"></div>
        <div id="cartTotal" class="total-box"></div>
        <button class="primary full" onclick="showCheckout()">Оформить заказ</button>
      </section>

      <section id="checkout" class="screen">
        <div class="section-head"><button class="back" onclick="showScreen('cart')">‹</button><h1>Оформление</h1></div>
        <div class="notice">🚚 Доставка оплачивается покупателем при получении и не входит в сумму заказа.</div>
        <label>Имя *</label><input id="name" class="input" placeholder="Ваше имя">
        <label>Телефон *</label><input id="phone" class="input" type="tel" placeholder="+998 90 123 45 67">
        <label>Адрес доставки *</label>
        <button class="location" onclick="requestLocation()">📍 Отправить геолокацию</button>
        <textarea id="address" class="input" rows="3" placeholder="Или введите адрес вручную"></textarea>
        <label>Комментарий</label>
        <textarea id="comment" class="input" rows="3" placeholder="Подъезд, этаж, ориентир..."></textarea>
        <div id="checkoutTotal" class="total-box"></div>
        <button class="primary full" onclick="submitOrder()">Подтвердить заказ</button>
      </section>

      <section id="success" class="screen center">
        <div class="success-icon">✓</div>
        <h1>Заказ оформлен!</h1>
        <p id="successText"></p>
        <button class="primary full" onclick="showScreen('home')">Вернуться в магазин</button>
      </section>
    </main>

    <nav>
      <button class="nav active" data-screen="home">⌂<span>Главная</span></button>
      <button class="nav" data-screen="catalog">⌕<span>Каталог</span></button>
      <button class="nav" data-screen="cart">🛒<span>Корзина</span></button>
      <button class="nav" data-screen="profile">♙<span>Профиль</span></button>
    </nav>
  </div>
<script src="app.js"></script>
</body>
</html>
